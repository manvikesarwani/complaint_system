
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | CampusCare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">Campus<span>Care</span></div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#statistics">Dashboard</a>
            <a href="index.html#complaints">Complaints</a>
        </nav>

    </header>


    <!-- Login Section -->
    <main class="login-container">

        <div class="login-card">

            <h1>Student Login</h1>

            <p class="login-description">
                Login to access your CampusCare account.
            </p>

            <form>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>


                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Register here</a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>CampusCare © 2026 | College Complaint Management System</p>
    </footer>

</body>
</html>
