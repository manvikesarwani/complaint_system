
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration | CampusCare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">

        <div class="logo">Campus<span>Care</span></div>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#statistics">Dashboard</a>
            <a href="index.html#complaints">Complaints</a>
        </nav>

    </header>


    <!-- Registration Section -->
    <main class="login-container">

        <div class="login-card">

            <h1>Student Registration</h1>

            <p class="login-description">
                Create your CampusCare account.
            </p>

            <form>

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="roll">Roll Number</label>

                    <input
                        type="text"
                        id="roll"
                        placeholder="Enter your roll number"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="email">College Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your college email"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >
                </div>


                <button type="submit" class="login-submit">
                    Register
                </button>

            </form>


            <p class="register-link">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>CampusCare © 2026 | College Complaint Management System</p>
    </footer>

</body>
</html>
